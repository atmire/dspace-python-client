name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python (>=3.11) and the classifiers in pyproject.toml.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,examples]"

      - name: Run tests
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Gating: the tree is fully formatted, so any drift is a real regression.
      - name: Check formatting
        run: ruff format --check .

      # Informational: ~327 findings remain from before the rule set was tuned.
      # Flip this to gating (drop continue-on-error) once that backlog is cleared.
      - name: Lint
        id: lint
        continue-on-error: true
        run: ruff check . --output-format=github

      - name: Lint summary
        if: always()
        run: |
          {
            echo "### ruff check"
            echo
            if [ "${{ steps.lint.outcome }}" = "success" ]; then
              echo "No findings. Consider making this step gating."
            else
              echo "Findings below are informational and do not fail the build."
              echo
              echo '```'
              ruff check . --statistics || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
